name: OpenGlass
options:
  bundleIdPrefix: com.openglass
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "1.0.0"

settings:
  base:
    SWIFT_VERSION: "6.3"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  OpenGlass:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openglass.app
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/OpenGlass.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - framework: CoreBluetooth.framework
      - framework: NetworkExtension.framework
      - framework: CryptoKit.framework
      - framework: Security.framework
      - framework: Speech.framework
      - framework: AVFoundation.framework
      - framework: Photos.framework
