name: Build & Archive

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build OpenGlass
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project OpenGlass.xcodeproj \
            -scheme OpenGlass \
            -configuration Release \
            -archivePath build/OpenGlass.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      - name: Export .ipa (unsigned)
        run: |
          mkdir -p build/ipa
          cd build/OpenGlass.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r OpenGlass.app Payload/
          zip -r ../../../ipa/OpenGlass-unsigned.ipa Payload
          cd ../../../..

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGlass-unsigned
          path: build/ipa/OpenGlass-unsigned.ipa
          retention-days: 30

      - name: Upload .xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGlass-xcarchive
          path: build/OpenGlass.xcarchive
          retention-days: 14
