name: Build & Check

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Swift Compile Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Check syntax (all .swift files)
        run: |
          echo "Checking Swift files for syntax errors..."
          echo "(Skipping Sources/SDK/ — requires iOS SDK modules)"
          find Sources -name '*.swift' -not -path 'Sources/SDK/*' | while read f; do
            echo "  Checking $f"
            swiftc -parse "$f" 2>&1 || true
          done
          echo "Syntax check complete."

      - name: Count lines of code
        run: |
          echo "Swift files:"
          find Sources -name '*.swift' | wc -l
          echo "Total lines:"
          find Sources -name '*.swift' -exec cat {} + | wc -l

